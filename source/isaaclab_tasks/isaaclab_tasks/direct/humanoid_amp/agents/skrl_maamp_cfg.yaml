seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  multi_policy: True
  separate: True
  exo:
    policy:
      class: GaussianMixin
      clip_actions: False
      clip_log_std: True
      min_log_std: -20.0
      max_log_std: 2.0
      initial_log_std: 0.0
      network:
        - name: net
          input: STATES
          layers: [32, 32]
          activations: elu
      output: ACTIONS
    value:
      class: DeterministicMixin
      clip_actions: False
      network:
        - name: net
          input: STATES
          layers: [32, 32]
          activations: elu
      output: ONE

  humanoid:
    policy:  # see gaussian_model parameters
      class: GaussianMixin
      clip_actions: False
      clip_log_std: True
      min_log_std: -20.0
      max_log_std: 2.0
      initial_log_std: -2.9
      fixed_log_std: True
      network:
        - name: net
          input: STATES
          layers: [1024, 512]
          activations: relu
      output: ACTIONS
    value:  # see deterministic_model parameters
      class: DeterministicMixin
      clip_actions: False
      network:
        - name: net
          input: STATES
          layers: [1024, 512]
          activations: relu
      output: ONE
    discriminator:  # see deterministic_model parameters
      class: DeterministicMixin
      clip_actions: False
      network:
        - name: net
          input: STATES
          layers: [1024, 512]
          activations: relu
      output: ONE


  # Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)

# AMP memory (reference motion dataset)
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
motion_dataset:
  class: RandomMemory
  memory_size: 200000

# AMP memory (preventing discriminator overfitting)
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
reply_buffer:
  class: RandomMemory
  memory_size: 1000000



# IPPO agent configuration (field names are from IPPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/multi_agents/ippo.html
agent:
  PPO:
    class: PPO
    rollouts: 16
    learning_epochs: 8
    mini_batches: 2

    discount_factor: 0.99
    lambda: 0.95

    learning_rate: 1.0e-3
    learning_rate_scheduler: KLAdaptiveLR
    learning_rate_scheduler_kwargs: {}

    state_preprocessor: RunningStandardScaler
    state_preprocessor_kwargs: {}
    value_preprocessor: RunningStandardScaler
    value_preprocessor_kwargs: {}

    random_timesteps: 0
    learning_starts: 0

    grad_norm_clip: 0.5
    ratio_clip: 0.2
    value_clip: 0.2
    clip_predicted_values: false

    entropy_loss_scale: 0.0
    value_loss_scale: 1.0

    kl_threshold: 0

    rewards_shaper: null
    time_limit_bootstrap: false

    mixed_precision: false


  AMP:
    class: AMP
    rollouts: 16
    learning_epochs: 6
    mini_batches: 2

    discount_factor: 0.99
    lambda: 0.95

    learning_rate: 5.0e-5
    learning_rate_scheduler: null
    learning_rate_scheduler_kwargs: {}

    state_preprocessor:  RunningStandardScaler
    state_preprocessor_kwargs: {}
    value_preprocessor:  RunningStandardScaler
    value_preprocessor_kwargs: {}
    amp_state_preprocessor:  RunningStandardScaler
    amp_state_preprocessor_kwargs: {}

    random_timesteps: 0
    learning_starts: 0

    grad_norm_clip: 0.0
    ratio_clip: 0.2
    value_clip: 0.2
    clip_predicted_values: True

    entropy_loss_scale: 0.0
    value_loss_scale: 2.5
    discriminator_loss_scale: 5.0

    amp_batch_size: 512
    task_reward_weight: 0.0
    style_reward_weight: 1.0
    discriminator_batch_size: 4096
    discriminator_reward_scale: 2
    discriminator_logit_regularization_scale: 0.05
    discriminator_gradient_penalty_scale: 5
    discriminator_weight_decay_scale: 0.0001

    rewards_shaper: null
    time_limit_bootstrap: false

    mixed_precision: false

  experiment:
    directory: "Hexo"
    experiment_name: ""
    write_interval: auto

    checkpoint_interval: auto




# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 480
  environment_info: log
